<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sandglass — Focus Timer</title>
<meta name="description" content="A quiet, distraction-free focus timer that works offline and installs like an app." />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="theme-color" content="#101820" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>

  <div class="topbar">
    <div class="brand">
      <svg viewBox="0 0 512 512" fill="none" stroke="#C9A227" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
        <path d="M176 120 H336"/>
        <path d="M176 392 H336"/>
        <path d="M192 120 C192 200 256 224 256 256 C256 224 320 200 320 120"/>
        <path d="M192 392 C192 312 256 288 256 256 C256 288 320 312 320 392"/>
      </svg>
      <span>Sandglass</span>
    </div>
    <button id="notify-btn" title="Get notified when a session ends" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    </button>
    <button id="install-btn">Install app</button>
  </div>

  <main>
    <div class="mode-switch" role="tablist" aria-label="Timer mode">
      <button id="mode-work" class="active" role="tab" aria-selected="true">Focus</button>
      <button id="mode-rest" role="tab" aria-selected="false">Rest</button>
    </div>

    <div class="dial-wrap">
      <svg viewBox="0 0 200 200">
        <circle class="dial-track" cx="100" cy="100" r="90" />
        <circle id="dial-progress" class="dial-progress" cx="100" cy="100" r="90"
                stroke-dasharray="565.5" stroke-dashoffset="0" />
      </svg>
      <div class="time" id="time-display">25:00</div>
    </div>

    <div class="label" id="status-label">Ready when you are</div>

    <div class="controls">
      <button id="primary-btn">Start</button>
      <button id="reset-btn">Reset</button>
    </div>

    <div class="session-count" id="session-count" aria-label="Completed focus sessions today">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
  </main>

  <div class="toast" id="toast"></div>

<script>

  // ---------- Service worker ----------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {
        // Offline support just won't be available; app still works online.
      });
    });
  }
</script>

<script src="notifications.js"></script>
<script src="timer.js"></script>
<script src="install.js"></script>
</body>
</html>
